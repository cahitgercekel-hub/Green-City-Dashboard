name: Build and publish to Github Container Registry

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository ***REMOVED******REMOVED***

jobs:
  build-and-push-images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY ***REMOVED******REMOVED***
          username: ${{ github.actor ***REMOVED******REMOVED***
          password: ${{ secrets.GHCR_TOKEN ***REMOVED******REMOVED***

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v3
        with:
          images: ${{ env.REGISTRY ***REMOVED******REMOVED***/${{ env.IMAGE_NAME ***REMOVED******REMOVED***
          flavor: |
            latest=auto
            prefix=
            suffix=

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags ***REMOVED******REMOVED***
          labels: ${{ steps.meta.outputs.labels ***REMOVED******REMOVED***
