build_push_docker:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:v1.6.0-debug
    entrypoint: ['']
  script:
    - /kaniko/executor
      --context "${CI_PROJECT_DIR***REMOVED***"
      --dockerfile "${CI_PROJECT_DIR***REMOVED***/Dockerfile"
      --destination "${CI_REGISTRY_IMAGE***REMOVED***:${CI_COMMIT_REF_NAME***REMOVED***"
